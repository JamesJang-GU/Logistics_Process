<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 수출입물류 프로세스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#13233a; --muted:#5d6b7e; --line:#dde3ea;
  --navy:#0f2742; --amber:#f5a623; --amber-soft:#fff4df; --sea:#1d6fb8; --air:#7b4fd6;
  --ok:#1f9d6b; --shadow:0 6px 24px rgba(15,39,66,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:18px 28px 14px}
header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.3px}
header p{margin:4px 0 0;color:#b9c6d8;font-size:13.5px}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;color:var(--muted);transition:.15s}
.tab:hover{color:var(--ink);border-color:#b9c4d2}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--shadow)}
.tab .k{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:6px;background:var(--amber);color:#3b2600;vertical-align:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.variant{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.variant button{border:0;background:transparent;font:inherit;font-weight:700;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.variant button.on{background:var(--amber);color:#3b2600}
.intro{color:var(--muted);font-size:13.5px;flex:1;min-width:260px}
.stage{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative}
#scene{display:block;width:100%;height:auto;user-select:none}
.node{cursor:help}
.node rect.box{fill:#fff;stroke:#c9d3df;stroke-width:1.5;transition:.2s}
.node.office rect.box{fill:#f7f9fc}
.node:hover rect.box{stroke:var(--amber);stroke-width:2.5}
.node.active rect.box{stroke:var(--amber);stroke-width:3;fill:var(--amber-soft)}
.node text{font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.node .lbl{font-size:13px;font-weight:700;fill:var(--ink)}
.node .sub{font-size:10.5px;fill:var(--muted)}
.lane-lbl{font-size:11px;fill:#7a8797;font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.ctrl button:hover{border-color:var(--amber)}
.ctrl button.primary{background:var(--navy);color:#fff;border-color:var(--navy);min-width:96px}
.ctrl label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.prog{height:4px;background:#e8edf3}
.prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.caption{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 18px;border-top:1px solid var(--line);background:#fbfcfe}
.caption .no{grid-row:span 2;font-size:28px;font-weight:900;color:var(--amber);line-height:1}
.caption .tt{font-size:17px;font-weight:900}
.caption .who{display:inline-block;font-size:11.5px;font-weight:700;background:#e9eef5;color:#33475f;border-radius:20px;padding:1px 9px;margin-left:8px;vertical-align:2px}
.caption .dd{font-size:13.5px;color:#34465c}
.caption .dd ul{margin:4px 0 0;padding-left:18px}
#actors,#links{pointer-events:none}
.caption table{border-collapse:collapse;font-size:12px;margin-top:8px}
.caption th,.caption td{border:1px solid var(--line);padding:3px 7px;text-align:left;vertical-align:top}
.caption th{background:#eef2f7}
.steps-h{margin:22px 0 8px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.steps-h small{font-weight:500;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px 11px;cursor:pointer;position:relative;transition:.15s}
.card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.on{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 2px var(--amber) inset}
.card.done{opacity:.72}
.card .n{font-size:11px;font-weight:900;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px}
.card .ic{float:right;font-size:18px}
.card .t{font-weight:700;margin-top:6px;font-size:14px;line-height:1.35}
.card .w{font-size:11.5px;color:var(--muted);margin-top:3px}
.tip{position:fixed;z-index:50;max-width:440px;background:#0f2742;color:#e8eef6;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;box-shadow:0 12px 36px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip h4{margin:0 0 6px;font-size:15px;color:#fff}
.tip .who{display:inline-block;font-size:11px;font-weight:700;background:var(--amber);color:#3b2600;border-radius:20px;padding:0 8px;margin-bottom:6px}
.tip ul{margin:4px 0;padding-left:18px}
.tip b{color:#ffd58a}
.tip table{border-collapse:collapse;font-size:11.5px;margin-top:6px;width:100%}
.tip th,.tip td{border:1px solid #33506f;padding:3px 5px;text-align:left;vertical-align:top}
.tip th{background:#1b3a5c;color:#ffd58a}
.tip .src{margin-top:8px;font-size:11px;color:#8fa3bb}
.legend{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
@media (max-width:700px){header{padding:14px 16px}.wrap{padding:12px 16px 30px}.ctrl label{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>한국의 수출입물류 프로세스 — 해상 · 항공</h1>
  <p>「한국의 수출입물류 프로세스」 제2장 ‘수출입 절차별 물류 프로세스’ 기반 · 각 단계 카드와 장면 속 시설에 마우스를 올리면 해설이 나타납니다.</p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div class="variant" id="variant"></div>
    <div class="intro" id="intro"></div>
  </div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="prog"><i id="prog"></i></div>
    <div class="caption" id="caption"></div>
    <div class="ctrl">
      <button id="bPrev" title="이전 단계">⏮ 이전</button>
      <button id="bPlay" class="primary">▶ 재생</button>
      <button id="bNext" title="다음 단계">다음 ⏭</button>
      <button id="bReset" title="처음으로">↺ 처음</button>
      <label>속도 <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1"> <span id="spv">1.0x</span></label>
    </div>
  </div>
  <div class="steps-h">단계별 프로세스 <small>카드에 마우스를 올리면 상세 설명 · 클릭하면 해당 단계 애니메이션 재생</small></div>
  <div class="steps" id="steps"></div>
  <div class="legend" id="legend"></div>
</div>
<div class="tip" id="tip"></div>
<script>
/* ===================== 데이터: 해상 수출 ===================== */
const SC = {};
SC.seaEx = {
  tab:'🚢 해상 수출', kind:'sea', dir:'out',
  intro:'수출화물의 물류는 화주의 생산 공장(shipper’s door) 출고 시점부터 시작되어, 컨테이너 야드(CY)에서 선사에 의해 본선 적재가 이뤄지면 한국 내 운송 과정이 끝납니다. 내륙운송 경로는 육상(공로)·철도·연안 3가지입니다.',
  statics:{ship:true, crane:true},
  nodes:{
    shipper:{x:80,y:220,ic:'🏭',l:'화주 공장',sub:'Shipper’s door',d:'수출화물의 물류 프로세스가 시작되는 곳. 수출화물은 화주의 <b>자가장치장</b>이나 <b>타소장치장</b>을 거칠 수도 있고, 곧바로 운송이 시작될 수도 있습니다. <b>FCL</b>은 보통 화주 <b>문전통관</b> 후 수송되고, <b>LCL</b>은 미통관 상태로 수송되어 선적지에서 통관됩니다.'},
    icd:{x:250,y:220,ic:'🏗️',l:'의왕 ICD',sub:'내륙컨테이너기지',d:'<b>내륙화물복합운송기지(ICD)</b>. 시내운송을 거친 화물은 의왕·양산 등지의 ICD로 운송되어 부두나 공항으로 <b>보세운송</b>됩니다. ICD를 거치지 않고 곧바로 부두로 운송(공로직반)되기도 합니다.'},
    rail:{x:420,y:220,ic:'🚉',l:'부산진역',sub:'철도 CY',d:'의왕 ICD에서 철도로 보세운송된 컨테이너가 도착하는 철도 CY. 이곳에서 부두로 <b>셔틀운송</b>됩니다(철도직반).'},
    odcy:{x:580,y:220,ic:'📦',l:'ODCY / CFS',sub:'Off-Dock CY',d:'<b>ODCY(Off Dock CY)</b>: 부두 밖 컨테이너 야드. <b>CFS(Container Freight Station)</b>에서는 LCL 화물의 <b>혼재(consolidation)·컨테이너 적입</b> 작업이 이루어집니다. 이후 셔틀운송으로 컨테이너 부두에 반입됩니다.'},
    cy:{x:740,y:220,ic:'🗄️',l:'컨테이너 부두 CY',sub:'전용부두 · 일반부두',d:'<b>CY(Container Yard)</b>. CY 오퍼레이터는 Booking List에 따라 빈 컨테이너를 대출하고, 컨테이너화물을 인수할 때 <b>부두수취증(D/R)</b>에 서명 후 화주에게 반환합니다. 하역업체는 반입계와 Gate log를 확인하여 CY에 장치하였다가 선적작업을 수행합니다.'},
    forwarder:{x:250,y:62,ic:'🧑‍💼',l:'포워더',o:1,d:'<b>포워더(운송주선인)</b>. 수출자는 선박·항공기 수배 등 운송 관련 업무를 운송인에게 맡기는 경우가 많으며, 운송인은 수출자를 대신하여 선박수배·예약 업무를 진행합니다. 특히 LCL은 운임 할인 혜택 등을 위해 대부분 포워딩 회사를 이용합니다.'},
    carrier:{x:450,y:62,ic:'🏢',l:'선사(대리점)',o:1,d:'<b>선사</b>는 예약을 받으면 ①컨테이너의 준비 ②출하정보의 파악과 화물의 인수 ③컨테이너의 배치 ④화물의 인수 ⑤선적서류의 작성과 송부 업무를 수행합니다.'},
    customs:{x:650,y:62,ic:'🏛️',l:'세관',o:1,d:'<b>관세청·세관</b>. 수출신고 수리, 그리고 <b>적하목록 적재 전 신고제도</b>를 운영합니다(미국행 해상화물 적재 24시간 전, 기타 해상화물 적재 전, 근거리 해상·항공화물 출항익일 24시까지).'},
    buyer:{x:1110,y:62,ic:'🌏',l:'수입자(바이어)',o:1,d:'해외의 수입자. 선적이 끝나면 수출자로부터 <b>선적통지(Shipping Notice)</b>와 <b>선하증권 사본</b>을 받습니다.'}
  },
  flows:{
    FCL:[
      {t:'선박 스케줄 확인 · 선박 수배',who:'화주 / 포워더',a:'work',at:'forwarder',e:'🗓️',
       d:'출항일 전후 선적항에 기항하는 선박스케줄을 선사 홈페이지·전화, 또는 화주협의회(shippersgate.kita.net)·코리아쉬핑가제트·스케줄뱅크 등에서 확인합니다.<ul><li>① 입·출항일 및 시간, <b>transit time</b>, 직항/환적 여부</li><li>② <b>ETD</b>(출항예정)와 <b>ETA</b>(도착예정)</li><li>③ CY cargo인 경우 화물수취 <b>마감시간(closing time)</b></li></ul>‘Schedule is subject to change’이므로 확정 후에도 재확인 필요. 운송계약·선박수배 의무는 <b>FOB는 수입상</b>(운송인 지정, nomination), <b>CIF는 수출상</b>이 집니다.'},
      {t:'선적 예약 (Booking · S/R)',who:'화주 → 포워더 → 선사',a:'doc',from:'shipper',via:['forwarder'],to:'carrier',
       d:'화물 출고 전 또는 수출신고 전후에 선사 소정 양식인 <b>선적의뢰서(S/R: Shipping Request)</b>를 작성해 송부하고 접수 여부를 확인합니다.<ul><li>C/I·P/L만 보내는 예약은 정상적 청약으로 보기 어려워 문제 발생 시 화주가 불리</li><li>선사가 적하목록(manifest)을 직접 작성하므로 S/R을 정확히, 가급적 <b>수출신고필증 사본</b>도 제출</li><li>예약 변경은 선박 입항 전 서면·구두로 통지(양하항 변경 시 FCL은 하역업자 이송 전)</li></ul>S/R 항목: Shipper, Consignee, Notify Party, Vessel/Voyage, POL, POD, Container/Seal No., 포장수, 품명, 중량(kg), 용적(CBM) 등.'},
      {t:'Booking Note · Booking List 송부',who:'선사 → CY 오퍼레이터',a:'doc',from:'carrier',to:'cy',
       d:'선사(대리점)는 <b>화물선적예약서(booking note / confirmation)</b>를 전산 입력하고, <b>화물인수예약명세서(booking list)</b>를 관계 지점에 송부합니다. 선적예상목록과 선박스케줄은 하역업체에 통보됩니다. 원칙적으로 화주와 일등항해사 앞으로 <b>선적지시서(S/O)</b>를 보내지만, 실무에서는 구두로 예약번호만 알려주는 경우가 많습니다.'},
      {t:'공컨테이너 반출 (EIR)',who:'CY 오퍼레이터 → 화주',a:'truckE',from:'cy',to:'shipper',
       d:'Booking List를 기초로 선사의 지시에 따라 CY 오퍼레이터는 필요한 <b>빈 컨테이너</b>를 화주에게 대출하고 <b>기기수도증(EIR: Equipment Interchange Receipt)</b>을 접수합니다. 화주는 운송사와 운송일정을 협의하여 빈 컨테이너를 인수합니다(공컨운송).'},
      {t:'화물 적입 · Sealing · 수출통관',who:'화주 (관세사)',a:'work',at:'shipper',e:'📦',
       d:'화주는 빈 컨테이너에 화물을 <b>적입 및 sealing</b>합니다(이 과정도 운송인이 맡는 경우가 많음). FCL 화물은 보통 <b>화주 문전통관</b> 후 수송됩니다. 수출화물은 자가장치장이나 타소장치장을 거칠 수도 있습니다. 세계적으로 규격화된 컨테이너는 운송·보관·하역을 효율화하고 물류비를 낮춥니다.'},
      {t:'내륙운송 (공로) → 의왕 ICD',who:'운송업체',a:'truck',from:'shipper',to:'icd',
       d:'수출화물은 시내운송을 거쳐 의왕·양산 등지의 <b>ICD</b>로 운송됩니다. 내륙 경로는 <b>육상운송·철도운송·연안운송</b> 3가지이며 화물의 양·종류에 따라 선택합니다. ICD를 거치지 않고 부두로 바로 가는 <b>공로직반</b>도 있습니다.'},
      {t:'철도 보세운송 → 부산진역',who:'철도운송',a:'train',from:'icd',to:'rail',
       d:'ICD에서 부두·공항으로 <b>보세운송</b>됩니다. 의왕 ICD → 부산진역(철도 CY) 구간은 철도로 수송되는 대표 경로입니다(철도직반).'},
      {t:'셔틀운송 → 부두 CY 반입 (D/R)',who:'운송업체 / CY 오퍼레이터',a:'truck',from:'rail',to:'cy',

    s+=`<g id="stPlane" transform="translate(${PLANE_X} ${PLANE_Y})${flip}">${DRAW.plane()}</g>`;
  }
  return s;
}
function nodeSvg(id,n){
  const w=n.o?132:118,h=n.o?40:60;
  let s=`<g class="node${n.o?' office':''}" data-id="${id}" transform="translate(${n.x} ${n.y})">
    <rect class="box" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="10"/>`;
  if(n.o) s+=`<text x="${-w/2+12}" y="6" font-size="17">${n.ic}</text><text class="lbl" x="${-w/2+36}" y="5">${n.l}</text>`;
  else s+=`<text x="0" y="12" text-anchor="middle" font-size="30">${n.ic}</text><text class="lbl" x="0" y="${h/2+17}" text-anchor="middle">${n.l}</text>`+
    (n.sub?`<text class="sub" x="0" y="${h/2+31}" text-anchor="middle">${n.sub}</text>`:'');
  return s+'</g>';
}
function renderScene(){
  const sc=SC[cur.sc], svg=$('scene');
  let s=background(sc.kind);
  s+=`<g id="links"></g>`;
  for(const id in sc.nodes) s+=nodeSvg(id,sc.nodes[id]);
  s+=statics(sc)+`<g id="actors"></g>`;
  svg.innerHTML=s;
  svg.querySelectorAll('.node').forEach(g=>{
    const n=sc.nodes[g.dataset.id];
    g.addEventListener('mouseenter',e=>showTip(`<h4>${n.ic} ${n.l}</h4>${n.d}`,e));
    g.addEventListener('mousemove',moveTip);
    g.addEventListener('mouseleave',hideTip);
  });
}
/* ===================== 엔진: 상태 · 애니메이션 ===================== */
const cur={sc:'seaEx',v:'FCL',i:-1,playing:false,raf:0,timer:0,speed:1,token:0};
const steps=()=>SC[cur.sc].flows[cur.v];
const ICON={doc:'📄',truck:'🚛',truckE:'🚚',van:'🚐',train:'🚆',ship:'🚢',lift:'🏗️',plane:'✈️',uld:'🧱',tug:'🚜',work:'⚙️'};
const VLABEL={FCL:'FCL (만재화물)',LCL:'LCL (소량 혼재화물)',STD:'표준 절차'};

function pt(id){const sc=SC[cur.sc];return sc.nodes[id]||SPECIAL[sc.kind][id];}
function pathFor(s){
  const sc=SC[cur.sc], A=pt(s.from), B=pt(s.to);
  switch(s.a){
    case 'truck':case 'truckE':case 'van':case 'tug': return [[A.x,LANE],[B.x,LANE]];
    case 'train': return [[A.x,RAIL],[B.x,RAIL]];
    case 'doc': return [s.from,...(s.via||[]),s.to].map(k=>{const p=pt(k);return [p.x,p.y];});
    case 'ship': return [[A.x,WATER],[B.x,WATER]];
    case 'lift': {const p=[[830,LANE],[830,BOOM+60],[SHIP_X,BOOM+60],[SHIP_X,326]];return s.from==='ship'?p.reverse():p;}
    case 'uld': {const p=[[790,LANE],[820,LANE-6],[PLANE_X-45,PLANE_Y-28]];return s.from==='plane'?p.reverse():p;}
    case 'plane': return s.to==='sky'
      ? [[PLANE_X,PLANE_Y],[945,412],[1010,417],[1130,417],[1230,340],[1420,150]]
      : [[1420,110],[1200,405],[1040,417],[960,412],[PLANE_X,PLANE_Y]];
    default: {const p=pt(s.at);return [[p.x,p.y]];}
  }
}
function polyAt(pts,f){
  if(pts.length<2) return {x:pts[0][0],y:pts[0][1],dx:1,dy:0};
  const seg=[];let tot=0;
  for(let k=1;k<pts.length;k++){const l=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);seg.push(l);tot+=l;}
  let d=f*tot,k=0;while(k<seg.length-1&&d>seg[k]){d-=seg[k];k++;}
  const a=pts[k],b=pts[k+1],r=seg[k]?d/seg[k]:0;
  return {x:a[0]+(b[0]-a[0])*r,y:a[1]+(b[1]-a[1])*r,dx:b[0]-a[0],dy:b[1]-a[1]};
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function setStatic(id,on){const el=$(id==='ship'?'stShip':'stPlane');if(el) el.style.display=on?'':'none';}
function applyState(upto){
  const sc=SC[cur.sc];
  if(sc.kind==='sea') setStatic('ship',sc.statics.ship); else setStatic('plane',sc.statics.plane);
  steps().slice(0,upto).forEach(s=>applyFx(s));
}
function applyFx(s){if(!s.fx) return;(s.fx.show||[]).forEach(k=>setStatic(k,true));(s.fx.hide||[]).forEach(k=>setStatic(k,false));}

function highlight(s){
  document.querySelectorAll('#scene .node').forEach(g=>{
    const id=g.dataset.id;g.classList.toggle('active',[s.from,s.to,s.at,...(s.via||[])].includes(id));
  });
  // 서류 이동 경로 점선
  const L=$('links');L.innerHTML='';
  if(s.a==='doc'){const p=pathFor(s).map(q=>q.join(',')).join(' ');
    L.innerHTML=`<polyline points="${p}" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="5 6" opacity=".8"><animate attributeName="stroke-dashoffset" values="22;0" dur=".8s" repeatCount="indefinite"/></polyline>`;}
}

function runStep(i,onDone){
  const s=steps()[i], tok=++cur.token, layer=$('actors');
  cancelAnimationFrame(cur.raf);layer.innerHTML='';
  applyState(i);highlight(s);updateUI();
  const dur={doc:1800,work:2000,lift:3400,ship:3800,plane:4200,uld:1600,train:3000}[s.a]||2800;
  const pts=pathFor(s);
  const g=document.createElementNS(NS,'g');
  if(s.a==='work'){
    const p=pts[0][1]>120?-40:-32;
    g.innerHTML=`<circle r="34" fill="none" stroke="#f5a623" stroke-width="3"><animate attributeName="r" values="30;52" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/></circle>
      <g class="bob"><circle cx="40" cy="${p}" r="17" fill="#fff" stroke="#f5a623" stroke-width="2.5"/><text x="40" y="${p+7}" text-anchor="middle" font-size="19">${s.e||'⚙️'}</text></g>`;
  } else g.innerHTML=(DRAW[s.a]||DRAW.doc)();
  layer.appendChild(g);
  if(s.a==='ship') setStatic('ship',false);
  if(s.a==='plane') setStatic('plane',false);
  const cables=g.querySelectorAll('.cable'), trolley=$('trolley');
  const t0=performance.now(), D=dur/cur.speed;
  const frame=now=>{
    if(tok!==cur.token) return;
    const t=Math.min(1,(now-t0)/D), e=s.a==='work'?t:ease(t);
    const q=polyAt(pts,e);let x=q.x,y=q.y,tr='';
    if(s.a==='work'){x=pts[0][0];y=pts[0][1];const b=g.querySelector('.bob');b.setAttribute('transform',`translate(0 ${-Math.abs(Math.sin(t*Math.PI*4))*8})`);}
    else if(s.a==='doc'){y-=Math.sin(t*Math.PI)*24;}
    else if(['truck','truckE','van','tug','train'].includes(s.a)){y+=Math.sin(now/55)*.6;if(q.dx<0) tr=' scale(-1 1)';}
    else if(s.a==='ship'){y+=Math.sin(now/300)*1.5;if(q.dx<0) tr=' scale(-1 1)';}
    else if(s.a==='plane'){
      // 이륙: 기수 들림만 허용 / 착륙: 약간의 기수 내림만 허용 (지상 활주 중에는 수평 유지)
      if(q.dx<0){let th=Math.atan2(-q.dy,-q.dx)*180/Math.PI;th=q.dy>0&&q.y<390?Math.max(-12,th):0;tr=` rotate(${th}) scale(-1 1)`;}
      else{let th=Math.atan2(q.dy,q.dx)*180/Math.PI;th=Math.max(-28,Math.min(0,th));tr=` rotate(${th})`;}
    }
    else if(s.a==='lift'){cables.forEach(c=>c.setAttribute('y2',BOOM+8-y));if(trolley) trolley.setAttribute('x',x-15);}
    if(s.a==='uld'){g.style.opacity=s.from==='plane'?Math.min(1,t*5):Math.min(1,(1-t)*5);}
    g.setAttribute('transform',`translate(${x} ${y})${tr}`);
    if(t<1) cur.raf=requestAnimationFrame(frame);
    else {applyFx(s);if(s.a==='plane'||s.a==='ship') layer.innerHTML='';onDone&&onDone(tok);}
  };
  cur.raf=requestAnimationFrame(frame);
}

function go(i,auto){
  clearTimeout(cur.timer);
  const n=steps().length;if(i<0||i>=n) return;
  cur.i=i;
  runStep(i,tok=>{
    markDone();
    if(cur.playing&&tok===cur.token){
      if(cur.i<n-1) cur.timer=setTimeout(()=>go(cur.i+1),700/cur.speed);
      else {cur.playing=false;updateUI();}
    }
  });
}

/* ===================== UI ===================== */
function stepTip(s,k){return `<div class="who">STEP ${k+1} · ${s.who}</div><h4>${s.t}</h4>${s.d}<div class="src">출처: 한국의 수출입물류 프로세스 제2장</div>`;}
function buildTabs(){
  $('tabs').innerHTML=Object.keys(SC).map(k=>`<button class="tab${k===cur.sc?' on':''}" data-k="${k}">${SC[k].tab}<span class="k">${Object.values(SC[k].flows).map(f=>f.length).join(' / ')}단계</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur.sc=b.dataset.k;cur.v=Object.keys(SC[cur.sc].flows)[0];load();});
}
function buildVariant(){
  const vs=Object.keys(SC[cur.sc].flows), el=$('variant');
  el.style.display=vs.length>1?'':'none';
  el.innerHTML=vs.map(v=>`<button class="${v===cur.v?'on':''}" data-v="${v}">${VLABEL[v]}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur.v=b.dataset.v;load();});
}
function buildSteps(){
  const el=$('steps');
  el.innerHTML=steps().map((s,k)=>`<div class="card" data-k="${k}"><span class="n">${String(k+1).padStart(2,'0')}</span><span class="ic">${s.a==='work'?(s.e||'⚙️'):ICON[s.a]}</span><div class="t">${s.t}</div><div class="w">${s.who}</div></div>`).join('');
  el.querySelectorAll('.card').forEach(c=>{
    const k=+c.dataset.k;
    c.onmouseenter=e=>showTip(stepTip(steps()[k],k),e);
    c.onmousemove=moveTip;c.onmouseleave=hideTip;
    c.onclick=()=>{cur.playing=false;go(k);};
  });
}
function markDone(){document.querySelectorAll('#steps .card').forEach((c,k)=>c.classList.toggle('done',k<cur.i));}
function updateUI(){
  const n=steps().length, s=steps()[cur.i];
  document.querySelectorAll('#steps .card').forEach((c,k)=>{c.classList.toggle('on',k===cur.i);c.classList.toggle('done',k<cur.i);});
  $('prog').style.width=cur.i<0?'0':((cur.i+1)/n*100)+'%';
  $('bPlay').textContent=cur.playing?'⏸ 일시정지':'▶ 재생';
  $('caption').innerHTML=s
    ?`<div class="no">${String(cur.i+1).padStart(2,'0')}</div><div class="tt">${s.t}<span class="who">${s.who}</span></div><div class="dd">${s.d}</div>`
    :`<div class="no">▶</div><div class="tt">${SC[cur.sc].tab} · ${VLABEL[cur.v]}</div><div class="dd">‘재생’을 누르면 ${n}단계 프로세스가 순서대로 진행됩니다. 장면 속 시설·기관과 아래 단계 카드에 마우스를 올리면 PDF 해설이 표시됩니다.</div>`;
}
function load(){
  cur.playing=false;cur.token++;cancelAnimationFrame(cur.raf);clearTimeout(cur.timer);cur.i=-1;
  buildTabs();buildVariant();buildSteps();renderScene();applyState(0);
  $('intro').textContent=SC[cur.sc].intro;updateUI();
}
$('bPlay').onclick=()=>{
  if(cur.playing){cur.playing=false;updateUI();return;}
  cur.playing=true;const n=steps().length;
  go(cur.i<0||cur.i>=n-1?0:cur.i+1);
};
$('bNext').onclick=()=>{cur.playing=false;go(Math.min(cur.i+1,steps().length-1));};
$('bPrev').onclick=()=>{cur.playing=false;go(Math.max(cur.i-1,0));};
$('bReset').onclick=load;
$('speed').oninput=e=>{cur.speed=+e.target.value;$('spv').textContent=cur.speed.toFixed(2).replace(/0$/,'')+'x';};

/* 툴팁 */
const tip=$('tip');
function showTip(html,e){tip.innerHTML=html;tip.classList.add('show');moveTip(e);}
function moveTip(e){
  const pad=16,w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth-8) x=e.clientX-w-pad;
  if(y+h>innerHeight-8) y=Math.max(8,innerHeight-h-8);
  tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('show');}

$('legend').innerHTML=`<b>용어</b> · <b>FCL</b> 한 화주 화물로 컨테이너를 채운 만재화물 · <b>LCL</b> 여러 화주의 소량 혼재화물 · <b>CY</b> 컨테이너 야드 · <b>CFS</b> 컨테이너 화물 조작장(혼재·적출) · <b>ODCY</b> 부두 밖 CY · <b>ICD</b> 내륙컨테이너기지 · <b>S/R</b> 선적의뢰서 · <b>EIR</b> 기기수도증 · <b>D/R</b> 부두수취증 · <b>B/L</b> 선하증권 · <b>D/O</b> 화물인도지시서 · <b>L/G</b> 수입화물선취보증서 · <b>AWB</b> 항공운송장 · <b>ULD</b> 항공 탑재용기<br>
<b>애니메이션</b> · 🚛 컨테이너 트럭 · 🚚 공컨테이너 · 🚐 소량화물 차량 · 🚆 철도 · 🏗️ 갠트리크레인 적·양하 · 🚢 선박 · 🚜 ULD 견인차 · ✈️ 항공기 · 📄 서류·전자신고 흐름(점선)`;
(function(){ // 딥링크: #seaIm/FCL/5  (탭/변형/단계번호)
  const [k,v,n]=decodeURIComponent(location.hash.slice(1)).split('/');
  if(SC[k]){cur.sc=k;if(SC[k].flows[v]) cur.v=v;}
  load();
  if(SC[k]&&n) go(Math.max(0,Math.min(+n-1,steps().length-1)));
})();
</script>
