<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수출입물류 Process Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#13233a; --muted:#5d6b7e; --line:#dde3ea;
  --navy:#0f2742; --amber:#f5a623; --amber-soft:#fff4df; --doc:#2f6fb5; --doc-soft:#e8f1fb;
  --cargo:#c77a12; --cargo-soft:#fdf3e1; --shadow:0 6px 24px rgba(15,39,66,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:14px 24px 12px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.3px}
header p{margin:0;color:#b9c6d8;font-size:12.5px}
.wrap{max-width:1680px;margin:0 auto;padding:14px 18px 30px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;color:var(--muted)}
.tab:hover{color:var(--ink);border-color:#b9c4d2}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--shadow)}
.intro{flex:1;min-width:260px;color:var(--muted);font-size:12.8px}
.main{display:grid;grid-template-columns:minmax(250px,18%) 1fr;gap:14px;align-items:start}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.flowp{padding:10px 10px 12px}
.flowp h2,.stage h2{margin:0;font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.variant{display:flex;gap:4px;background:#f1f4f8;border:1px solid var(--line);border-radius:9px;padding:3px;margin:8px 0}
.variant button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;padding:5px 6px;border-radius:7px;cursor:pointer;color:var(--muted)}
.variant button.on{background:var(--amber);color:#3b2600}
#flow{display:block;width:100%;height:auto}
.fb{cursor:pointer}
.fb .shape{stroke-width:1.4;transition:fill .2s,stroke .2s}
.fb.doc .shape{fill:#fff;stroke:#8fb2da}
.fb.cargo .shape{fill:#fff;stroke:#e2b56c}
.fb:hover .shape{stroke:var(--amber);stroke-width:2.4}
.fb.on .shape{fill:var(--amber);stroke:#c98100;stroke-width:2.4}
.fb.done .shape{fill:#f4f6f9}
.fb.done text{opacity:.62}
.fb text{font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.fb .no{font-size:10px;font-weight:900;fill:#fff}
.fb .nc{fill:var(--navy)}
.fb.on .nc{fill:#3b2600}
.fb .lb{font-size:10.6px;font-weight:700;fill:var(--ink)}
.fb .ic{font-size:11px}
.conn{fill:none;stroke:#9aa8b8;stroke-width:1.4}
.conn.done{stroke:#c98100}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:6px;padding:0 4px}
.flegend span{display:flex;align-items:center;gap:4px}
.flegend i{display:inline-block;width:16px;height:11px;border:1.5px solid;border-radius:2px}
.stage{position:relative}
.stage .hd{display:flex;align-items:center;gap:10px;padding:10px 14px 0;flex-wrap:wrap}
.stage .hd small{color:var(--muted);font-weight:500;font-size:12px}
#scene{display:block;width:100%;height:auto;user-select:none}
.party{cursor:help}
.party rect{fill:#fff;stroke:#c9d6e5;stroke-width:1.4;transition:.2s}
.party:hover rect{stroke:var(--amber);stroke-width:2.2}
.party.on rect{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2.6}
.party text{font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.fac{cursor:help}
.fac .pill{fill:rgba(255,255,255,.94);stroke:#b9c4d2;stroke-width:1.2;transition:.2s}
.fac:hover .pill{stroke:var(--amber);stroke-width:2.2}
.fac.on .pill{fill:var(--amber);stroke:#c98100}
.fac text{font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.route{fill:none;stroke:#f5a623;stroke-width:2.2;stroke-dasharray:5 5;opacity:.45;stroke-linecap:round;stroke-linejoin:round}
.route.done{opacity:.8;stroke-dasharray:none;stroke:#e3a13a}
.route.on{opacity:1;stroke-width:4;stroke-dasharray:10 7;animation:dash 0.8s linear infinite;stroke:#ff9a00}
@keyframes dash{to{stroke-dashoffset:-17}}
.badge circle{fill:#fff;stroke:#c98100;stroke-width:1.4}
.badge text{font-size:9.5px;font-weight:900;fill:#8a5500;font-family:'Noto Sans KR',sans-serif}
.badge.on circle{fill:#ff9a00;stroke:#8a5500}
.badge.on text{fill:#fff}
.gl{font-family:'Noto Sans KR',sans-serif;font-weight:700;pointer-events:none}
#actors,#railActors,#docLayer,#routes,#badges,#marker,#fxLayer{pointer-events:none}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.ctrl button:hover{border-color:var(--amber)}
.ctrl button.primary{background:var(--navy);color:#fff;border-color:var(--navy);min-width:92px}
.ctrl label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.prog{height:4px;background:#e8edf3}
.prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.caption{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe;min-height:96px}
.caption .no{grid-row:span 2;font-size:28px;font-weight:900;color:var(--amber);line-height:1}
.caption .tt{font-size:16px;font-weight:900}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.chip.who{background:#e9eef5;color:#33475f}
.chip.doc{background:var(--doc-soft);color:var(--doc)}
.chip.cargo{background:var(--cargo-soft);color:var(--cargo)}
.caption .dd{font-size:13px;color:#34465c}
.caption .dd ul{margin:4px 0 0;padding-left:18px}
.caption table{border-collapse:collapse;font-size:11.5px;margin-top:6px}
.caption th,.caption td{border:1px solid var(--line);padding:3px 7px;text-align:left;vertical-align:top}
.caption th{background:#eef2f7}
.tip{position:fixed;z-index:50;max-width:440px;background:#0f2742;color:#e8eef6;border-radius:12px;padding:12px 14px;font-size:12.8px;line-height:1.6;box-shadow:0 12px 36px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip h4{margin:0 0 6px;font-size:14.5px;color:#fff}
.tip .who{display:inline-block;font-size:11px;font-weight:700;background:var(--amber);color:#3b2600;border-radius:20px;padding:0 8px;margin-bottom:6px}
.tip ul{margin:4px 0;padding-left:18px}
.tip b{color:#ffd58a}
.tip table{border-collapse:collapse;font-size:11px;margin-top:6px;width:100%}
.tip th,.tip td{border:1px solid #33506f;padding:3px 5px;text-align:left;vertical-align:top}
.tip th{background:#1b3a5c;color:#ffd58a}
#err{display:none;position:fixed;left:10px;bottom:10px;background:#b00020;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;z-index:99;max-width:80vw}
@media (max-width:900px){.main{grid-template-columns:1fr}.ctrl label{margin-left:0}header{padding:12px 16px}.wrap{padding:12px 16px 24px}}
</style>
</head>
<body>
<header>
  <h1>한국의 수출입물류 Process Map</h1>
  <p>「한국의 수출입물류 프로세스」 제2장 기반 · 좌측 순서도(서류/화물) ↔ 우측 3D 물류 흐름 · 모든 박스·시설·기관에 마우스를 올리면 해설</p>
</header>
<div class="wrap">
  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="intro" id="intro"></div>
  </div>
  <div class="main">
    <aside class="panel flowp">
      <h2>🧭 프로세스 순서도</h2>
      <div class="variant" id="variant"></div>
      <svg id="flow" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="flegend">
        <span><i style="border-color:#8fb2da;border-radius:2px 2px 6px 6px"></i>서류·신고</span>
        <span><i style="border-color:#e2b56c"></i>화물 이동</span>
        <span><i style="border-color:#e2b56c;border-left-width:4px;border-right-width:4px"></i>현장 작업</span>
      </div>
    </aside>
    <section class="panel stage">
      <svg id="scene" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="prog"><i id="prog"></i></div>
      <div class="caption" id="caption"></div>
      <div class="ctrl">
        <button id="bPrev">⏮ 이전</button>
        <button id="bPlay" class="primary">▶ 재생</button>
        <button id="bNext">다음 ⏭</button>
        <button id="bReset">↺ 처음</button>
        <label>속도 <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1"> <span id="spv">1.0x</span></label>
      </div>
    </section>
  </div>
</div>
<div class="tip" id="tip"></div>
<div id="err"></div>
<script>
window.onerror=(m,s,l,c)=>{const e=document.getElementById('err');e.style.display='block';e.textContent='JS 오류: '+m+' (line '+l+':'+c+')';};
/* ============================================================
   데이터 구조
   P : 서류·정보 흐름의 당사자(상단 서류 버스)
   F : 3D 장면의 물리 시설 (x0~x1 = 도로 방향 위치)
   step: {s:순서도 짧은 이름('|' 줄바꿈), t:제목, who, a:행위, from, to, via, at, k:서류명, fx, d}
   ============================================================ */
const SC={};
SC.seaEx={
  tab:'🚢 해상 수출', kind:'sea', dir:'out',
  intro:'수출화물의 물류는 화주의 공장(shipper’s door) 출고부터 시작되어, 컨테이너 야드(CY)에서 선사에 의해 본선 적재가 이뤄지면 한국 내 운송이 끝납니다. 내륙운송 경로는 육상(공로)·철도·연안 3가지입니다.',
  order:['shipper','forwarder','broker','carrier','cyop','customs','buyer'],
  P:{
    shipper:{ic:'🏭',l:'화주(수출자)',d:'수출자. <b>CIF</b> 조건이면 수출상이, <b>FOB</b> 조건이면 수입상이 운송계약·선박수배 의무를 집니다(FOB는 수입상이 운송인을 지정, nomination). 선적 후 수입자에게 선적통지를 합니다.'},
    forwarder:{ic:'🧑‍💼',l:'포워더',d:'<b>포워더(운송주선인)</b>. 수출자는 선박·항공기 수배 등 운송 관련 업무를 운송인에게 맡기는 경우가 많으며, 운송인은 수출자를 대신하여 선박수배·예약 업무를 진행합니다. 특히 LCL은 운임 할인 혜택 등을 위해 대부분 포워딩 회사(콘솔 업자)를 이용합니다.'},
    broker:{ic:'🧾',l:'관세사',d:'수출업체로부터 선적서류(상업송장·포장명세서 등)를 받아 수출신고서를 작성·제출하고 <b>수출신고필증</b>을 받아 전달합니다.'},
    carrier:{ic:'🏢',l:'선사(대리점)',d:'<b>선사</b>는 예약을 받으면 ①컨테이너의 준비 ②출하정보의 파악과 화물의 인수 ③컨테이너의 배치 ④화물의 인수 ⑤선적서류의 작성과 송부 업무를 수행합니다.'},
    cyop:{ic:'🗄️',l:'CY 오퍼레이터',d:'<b>CY(Container Yard) 오퍼레이터</b>는 Booking List에 따라 빈 컨테이너를 대출하고, 컨테이너화물을 인수할 때 <b>부두수취증(D/R)</b>에 서명 후 화주에게 반환합니다. 하역업체는 반입계와 Gate log를 확인하여 CY에 장치하였다가 선적작업을 수행합니다.'},
    customs:{ic:'🏛️',l:'세관',d:'<b>관세청·세관</b>. 수출신고 수리, 그리고 <b>적하목록 적재 전 신고제도</b>를 운영합니다(미국행 해상화물 적재 24시간 전, 기타 해상화물 적재 전, 근거리 해상·항공화물 출항익일 24시까지).'},
    buyer:{ic:'🌏',l:'수입자(바이어)',d:'해외의 수입자. 선적이 끝나면 수출자로부터 <b>선적통지(Shipping Notice)</b>와 <b>선하증권 사본</b>을 받습니다.'}
  },
  F:{
    shipper:{x0:1,x1:11,type:'factory',ic:'🏭',l:'화주 공장',rx:6,d:'수출화물의 물류 프로세스가 시작되는 곳(shipper’s door). 수출화물은 화주의 <b>자가장치장</b>이나 <b>타소장치장</b>을 거칠 수도 있고, 곧바로 운송이 시작될 수도 있습니다. <b>FCL</b>은 보통 화주 <b>문전통관</b> 후 수송되고, <b>LCL</b>은 미통관 상태로 수송되어 선적지에서 통관됩니다.'},
    icd:{x0:16,x1:30,type:'icd',ic:'🏗️',l:'의왕 ICD',rx:23,tx:23,d:'<b>내륙컨테이너기지(ICD)</b>. 시내운송을 거친 화물은 의왕·양산 등지의 ICD로 운송되어 부두나 공항으로 <b>보세운송</b>됩니다. ICD를 거치지 않고 곧바로 부두로 운송(공로직반)되기도 합니다.'},
    rail:{x0:34,x1:46,type:'station',ic:'🚉',l:'부산진역 (철도 CY)',rx:40,tx:39,d:'의왕 ICD에서 철도로 보세운송된 컨테이너가 도착하는 철도 CY. 이곳에서 부두로 <b>셔틀운송</b>됩니다(철도직반).'},
    odcy:{x0:50,x1:61,type:'odcy',ic:'📦',l:'ODCY / CFS',rx:55,d:'<b>ODCY(Off Dock CY)</b>: 부두 밖 컨테이너 야드. <b>CFS(Container Freight Station)</b>에서는 LCL 화물의 <b>혼재(consolidation)·컨테이너 적입</b> 작업이 이루어집니다. 이후 셔틀운송으로 컨테이너 부두에 반입됩니다.'},
    cy:{x0:63,x1:82,type:'cy',ic:'⚓',l:'컨테이너 부두 CY',rx:69,d:'<b>CY(Container Yard)</b>. CY 오퍼레이터는 Booking List에 따라 빈 컨테이너를 대출하고, 컨테이너화물을 인수할 때 <b>부두수취증(D/R)</b>에 서명 후 화주에게 반환합니다. 본선이 입항하면 <b>갠트리크레인</b>으로 본선에 적재합니다.'}
  },
  flows:{
    FCL:[
      {s:'선박 스케줄|확인 · 수배',t:'선박 스케줄 확인 · 선박 수배',who:'화주 / 포워더',a:'work',at:'forwarder',e:'🗓️',
       d:'출항일 전후 선적항에 기항하는 선박스케줄을 선사 홈페이지·전화, 또는 화주협의회(shippersgate.kita.net)·코리아쉬핑가제트·스케줄뱅크 등에서 확인합니다.<ul><li>① 입·출항일 및 시간, <b>transit time</b>, 직항/환적 여부</li><li>② <b>ETD</b>(출항예정)와 <b>ETA</b>(도착예정)</li><li>③ CY cargo인 경우 화물수취 <b>마감시간(closing time)</b></li></ul>‘Schedule is subject to change’이므로 확정 후에도 재확인 필요. 운송계약·선박수배 의무는 <b>FOB는 수입상</b>, <b>CIF는 수출상</b>이 집니다.'},
      {s:'선적 예약|(Booking · S/R)',t:'선적 예약 (Booking · S/R)',who:'화주 → 포워더 → 선사',a:'doc',k:'S/R',from:'shipper',via:['forwarder'],to:'carrier',
       d:'화물 출고 전 또는 수출신고 전후에 선사 소정 양식인 <b>선적의뢰서(S/R: Shipping Request)</b>를 작성해 송부하고 접수 여부를 확인합니다.<ul><li>C/I·P/L만 보내는 예약은 정상적 청약으로 보기 어려워 문제 발생 시 화주가 불리</li><li>선사가 적하목록(manifest)을 직접 작성하므로 S/R을 정확히, 가급적 <b>수출신고필증 사본</b>도 제출</li><li>예약 변경은 선박 입항 전 서면·구두로 통지</li></ul>S/R 항목: Shipper, Consignee, Notify Party, Vessel/Voyage, POL, POD, Container/Seal No., 포장수, 품명, 중량(kg), 용적(CBM) 등.'},

function box(pr,x0,x1,y0,y1,z0,z1,c,o={}){

  return poly(pr,[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],o.side||sh(c,-.22),STK)+
         poly(pr,[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],o.front||c,STK)+
         poly(pr,[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],o.top||sh(c,.25),STK);

  const layer=s.a==='train'?'railActors':'actors';
  const html=s.a==='lift'?V.box():s.a==='uld'?V.uld():V[s.a](d);
  $(layer).innerHTML=`<g id="mover">${html}</g>`;const el=$('mover');
  let dur=s.a==='lift'?3800:s.a==='uld'?2000:1300+L*55;
  animate(tok,dur/sp,f=>{const q=polyAt(p,ease(f));put(el,q);
    if(s.a==='lift'){setTrolley(q[0]);const c=$('cable'),a=P(q[0],6,17.5),b=P(q[0],6,q[2]+2.6);c.style.display='';
      c.setAttribute('x1',f1(a[0]));c.setAttribute('y1',f1(a[1]));c.setAttribute('x2',f1(b[0]));c.setAttribute('y2',f1(b[1]));}
    else if(s.a==='uld')el.style.opacity=s.to==='plane'?fade(f,.12,.18):fade(f,.18,.12);
    else el.style.opacity=fade(f,.08,.08);
  },()=>{if(s.a==='lift')$('cable').style.display='none';fin();});
}
/* ============================================================
   UI
   ============================================================ */
function go(i){
  const st=steps();clearTimeout(cur.timer);
  if(i<0)i=0;if(i>=st.length){cur.playing=false;updateUI();return;}
  cur.i=i;applyState(i);updateUI();
  runStep(i,()=>{
    applyFx(st[i]);syncStatics();
    ['actors','railActors','fxLayer','docLayer'].forEach(id=>$(id).innerHTML='');$('busHi').setAttribute('d','');
    drawMarker(cargoPoint(i+1));markDone(i);
    if(cur.playing){if(i+1<st.length)cur.timer=setTimeout(()=>go(i+1),700/cur.speed);else{cur.playing=false;updateUI();}}
  });
}
function markDone(i){
  document.querySelectorAll('#flow .fb').forEach(g=>{const k=+g.dataset.i;g.classList.toggle('done',k<=i&&k!==cur.i||k<cur.i);});
  for(let k=0;k<=i+1;k++){const c=$('cn'+k);if(c)c.classList.add('done');}
  const r=$('rt'+i);if(r){r.classList.remove('on');r.classList.add('done');}
}
function updateUI(){
  const st=steps(),i=cur.i,s=st[i],sc=SC[cur.sc];
  $('prog').style.width=(i<0?0:(i+1)/st.length*100)+'%';
  $('bPlay').textContent=cur.playing?'⏸ 일시정지':(i>=st.length-1?'▶ 처음부터':'▶ 재생');
  document.querySelectorAll('#flow .fb').forEach(g=>{const k=+g.dataset.i;g.classList.toggle('on',k===i);g.classList.toggle('done',k<i);});
  st.forEach((_,k)=>{const c=$('cn'+k);if(c)c.classList.toggle('done',k<=i&&i>=0);
    const r=$('rt'+k),b=$('bd'+k);if(r){r.classList.toggle('on',k===i);r.classList.toggle('done',k<i);}if(b)b.classList.toggle('on',k===i);});
  const on=new Set();if(s){[s.from,s.to,s.at,...(s.via||[])].forEach(x=>x&&on.add(x));}
  const isDoc=s&&(s.a==='doc'||(s.a==='work'&&!sc.F[s.at]));
  document.querySelectorAll('#scene .party').forEach(g=>g.classList.toggle('on',!!s&&isDoc&&on.has(g.dataset.id)));
  document.querySelectorAll('#scene .fac').forEach(g=>g.classList.toggle('on',!!s&&!isDoc&&on.has(g.dataset.id)));
  $('caption').innerHTML=s?`<div class="no">${String(i+1).padStart(2,'0')}</div><div class="tt">${s.t}<span class="chip ${lane(s)}">${lane(s)==='doc'?'📄 서류 흐름':'📦 화물 흐름'}</span><span class="chip who">${s.who}</span></div><div class="dd">${s.d}</div>`
    :`<div class="no">▶</div><div class="tt">${sc.tab} — ${VLABEL[cur.v]} (${st.length}단계)</div><div class="dd">${sc.intro}<br><b>재생</b>을 누르거나 좌측 순서도의 단계를 클릭하세요. 위쪽 띠는 <b>서류</b>가, 아래 3D 장면은 <b>실제 화물</b>이 움직입니다. 주황 핀은 현재 화물 위치입니다.</div>`;
  history.replaceState(null,'',`#${cur.sc}/${cur.v}/${i+1}`);
}
function buildTabs(){
  $('tabs').innerHTML=Object.keys(SC).map(k=>`<button class="tab${k===cur.sc?' on':''}" data-k="${k}">${SC[k].tab}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur.sc=b.dataset.k;cur.v=Object.keys(SC[cur.sc].flows)[0];load();});
}
function buildVariant(){
  const ks=Object.keys(SC[cur.sc].flows);
  $('variant').innerHTML=ks.map(k=>`<button class="${k===cur.v?'on':''}" data-k="${k}">${VLABEL[k]} · ${SC[cur.sc].flows[k].length}</button>`).join('');
  $('variant').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur.v=b.dataset.k;load();});
}
function load(i=-1){
  cur.token++;cur.playing=false;cur.running=false;clearTimeout(cur.timer);
  buildTabs();buildVariant();$('intro').textContent=SC[cur.sc].intro;
  renderScene();buildFlow();
  cur.i=-1;applyState(0);updateUI();
  if(i>=0)go(i);
}
/* ---------- 툴팁 ---------- */
const tip=$('tip');
function bindTip(el,html){el.addEventListener('mouseenter',e=>{tip.innerHTML=html();tip.classList.add('show');moveTip(e);});el.addEventListener('mousemove',moveTip);el.addEventListener('mouseleave',()=>tip.classList.remove('show'));}
function moveTip(e){const r=tip.getBoundingClientRect();let x=e.clientX+16,y=e.clientY+16;if(x+r.width>innerWidth-8)x=e.clientX-r.width-16;if(y+r.height>innerHeight-8)y=Math.max(8,innerHeight-r.height-8);tip.style.left=x+'px';tip.style.top=y+'px';}
/* ---------- 컨트롤 ---------- */
$('bPlay').onclick=()=>{const n=steps().length;
  if(cur.playing){cur.playing=false;updateUI();return;}
  cur.playing=true;updateUI();if(!cur.running)go(cur.i>=n-1?0:cur.i+1);};
$('bNext').onclick=()=>{cur.playing=false;go(Math.min(steps().length-1,cur.i+1));};
$('bPrev').onclick=()=>{cur.playing=false;go(Math.max(0,cur.i-1));};
$('bReset').onclick=()=>load();
$('speed').oninput=e=>{cur.speed=+e.target.value;$('spv').textContent=cur.speed.toFixed(1)+'x';};
(function(){const h=location.hash.slice(1).split('/');
  if(SC[h[0]]){cur.sc=h[0];cur.v=SC[h[0]].flows[h[1]]?h[1]:Object.keys(SC[h[0]].flows)[0];const n=parseInt(h[2]||'0',10);load(n>0?Math.min(n,SC[cur.sc].flows[cur.v].length)-1:-1);}
  else load();})();
</script>
</body>
